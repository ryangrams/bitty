name: Public USB installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bitty-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: arduino/setup-arduino-cli@v2
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_distribution.py --git
      - run: python tools/test.py
      - run: node tests/web_protocol_test.mjs
      - run: python tools/setup.py
      - run: python tools/build_site.py --preview-only --version "preview-${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .local/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish USB installer
        id: publish
        uses: actions/deploy-pages@v5
